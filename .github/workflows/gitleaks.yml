name: Reusable Gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git --no-banner --redact --exit-code 1 --timeout 300 /repo

      - name: Scan working tree
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$GITLEAKS_IMAGE" \
            dir --no-banner --redact --exit-code 1 --timeout 300 .
